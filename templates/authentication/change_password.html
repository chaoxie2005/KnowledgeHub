{% extends 'base_auth.html' %}
{% load static %}

{% block style %}
<style>
  /* 全局样式 */
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }

  /* 修改密码卡片样式 */
  .card {
    max-width: 450px;
    width: 100%;
    margin: 0 auto;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    border: none;
    background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
    overflow: hidden;
  }

  .card-body {
    padding: 30px;
  }

  /* 输入框样式 */
  .form-group {
    margin-bottom: 12px;
  }

  .inputZone {
    position: relative;
  }

  .inputZone img:first-child {
    position: absolute;
    left: 12px;
    top: 16px;
    width: 16px;
    height: 16px;
    color: #007bff;
    z-index: 5;
  }

  .inputZone img.password-toggle {
    position: absolute;
    right: 12px;
    top: 16px;
    width: 16px;
    height: 16px;
    color: #007bff;
    z-index: 5;
    cursor: pointer;
  }

  .form-control {
    height: 44px;
    border-radius: 8px;
    border: 1px solid #e0e0e0;
    padding: 10px 40px 10px 36px;
    transition: all 0.3s ease;
  }

  .form-control:hover {
    border-color: #c0c0c0;
  }

  .form-control:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
  }

  /* 错误信息样式 */
  .invalid-feedback {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: #dc3545;
  }

  /* 按钮样式 */
  .btn-primary {
    background-color: #007bff;
    border: none;
    border-radius: 8px;
    width: 100%;
    padding: 10px;
    font-weight: 500;
    transition: all 0.3s ease;
    margin-top: 20px;
  }

  .btn-primary:hover {
    background-color: #0069d9;
  }

  /* 文字与布局样式 */
  .card-title:first-child {
    text-align: right;
    margin-bottom: 10px;
  }

  .card-title {
    text-align: center;
    padding: 12px 0;
  }

  /* 响应式设计 */
  @media (max-width: 576px) {
    .card-body {
      padding: 20px;
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="card shadow-lg">
  <div class="card-body">
    <h5 class="card-title text-center"><a href="{% url 'core:index' %}" style="text-decoration: none">返回首页</a></h5>
    <h5 class="card-title text-center py-3">修改密码</h5>
    <form action="" method="post">
      {% csrf_token %}
      {% include 'part/messages.html' %}

      <!-- 旧密码 -->
      <div class="form-group inputZone">
        <img src="{% static 'img/authentication/lock.svg' %}" alt="锁图标">
        <img id="hide-password_1" src="{% static 'img/authentication/eye.svg' %}" alt="显示密码" class="password-toggle">
        <input type="password" name="old_password" id="password_1" placeholder="旧密码" class="form-control"
          autocomplete="off">
      </div>

      <!-- 新密码 -->
      <div class="form-group inputZone">
        <img src="{% static 'img/authentication/lock.svg' %}" alt="锁图标">
        <img id="hide-password_2" src="{% static 'img/authentication/eye.svg' %}" alt="显示密码" class="password-toggle">
        <input type="password" name="new_password" id="password_2" placeholder="新密码" class="form-control"
          autocomplete="off">
      </div>

      <!-- 确认密码 -->
      <div class="form-group inputZone">
        <img src="{% static 'img/authentication/lock.svg' %}" alt="锁图标">
        <img id="hide-password_3" src="{% static 'img/authentication/eye.svg' %}" alt="显示密码" class="password-toggle">
        <input type="password" name="re_password" id="password_3" placeholder="确认密码" class="form-control"
          autocomplete="off">
      </div>

      <input type="submit" value="提交" class="btn btn-primary" />
    </form>
  </div>
</div>
{% endblock %}

{% block js %}
<script src="{% static 'js/authentication/change_password.js' %}"></script>
{% endblock %}
