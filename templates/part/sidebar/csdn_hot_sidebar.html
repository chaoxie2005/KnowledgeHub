<!-- CSDN快讯侧边栏 -->
<div class="sidebar-section sidebar-csdn">
  <h3 class="sidebar-title" style="color:#fc5531;">
    最新CSDN快讯
    <small style="font-size:0.75rem;font-weight:400;color:#999;margin-left:auto;">最后更新：{% now "Y-m-d H:i" %}</small>
  </h3>
  <ul class="sidebar-list" style="list-style: none; padding: 0; margin: 0;">
    {% block latest-articles %}
      {% for article in last_articles %}
        <li class="sidebar-list-item">
          <a href="{{ article.original_url }}" target="_blank" rel="noopener noreferrer" class="sidebar-link"
             title="{{ article.title }}">{{ article.title|truncatechars:18 }}</a>
        </li>
      {% empty %}
        <li class="empty-item">暂无最新CSDN快讯</li>
      {% endfor %}
    {% endblock %}
  </ul>
</div>
