{% extends 'base.html' %}

{% block post %}

<style>
  /* AI问答页面样式 */
  .ai-qa-container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  .ai-qa-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .ai-qa-title {
    font-size: 32px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 16px;
  }

  .ai-qa-subtitle {
    font-size: 16px;
    color: #666;
  }

  .ai-qa-main {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    padding: 32px;
    margin-bottom: 32px;
  }

  .ai-qa-input-container {
    position: relative;
    margin-bottom: 24px;
  }

  .ai-qa-input {
    width: 100%;
    padding: 20px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 16px;
    min-height: 120px;
    resize: vertical;
    outline: none;
    transition: all 0.3s ease;
  }

  .ai-qa-input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  }

  .ai-qa-controls {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 24px;
  }

  .ai-qa-button {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .ai-qa-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
  }

  .ai-qa-button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .ai-qa-answer {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 24px;
    margin-top: 24px;
  }

  .ai-qa-answer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .ai-qa-answer-title {
    font-size: 18px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .ai-qa-answer-content {
    font-size: 16px;
    line-height: 1.6;
    color: #333;
  }

  .ai-qa-answer-content pre {
    background: #f1f3f4;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 16px 0;
  }

  .ai-qa-answer-content code {
    font-family: 'Courier New', Courier, monospace;
    background: #f1f3f4;
    padding: 2px 4px;
    border-radius: 4px;
  }

  .loading-spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid #f3f3f3;
    border-top: 2px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }

    100% {
      transform: rotate(360deg);
    }
  }

  /* 响应式设计 */
  @media (max-width: 768px) {
    .ai-qa-container {
      padding: 20px 16px;
    }

    .ai-qa-title {
      font-size: 24px;
    }

    .ai-qa-main {
      padding: 20px;
    }

    .ai-qa-controls {
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }

    .ai-qa-options {
      width: 100%;
      flex-wrap: wrap;
    }

    .ai-qa-suggestion-grid {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
  }
</style>

<div class="ai-qa-container">
  <div class="ai-qa-header">
    <h1 class="ai-qa-title">AI问答</h1>
    <p class="ai-qa-subtitle">输入你的问题，AI将基于全站内容提供准确的答案</p>
  </div>

  <div class="ai-qa-main">
    <div class="ai-qa-history" id="aiChatHistory" style="margin-bottom: 24px; max-height: 400px; overflow-y: auto;">
    </div>

    <div class="ai-qa-input-container">
      <textarea id="aiQuestion" class="ai-qa-input" placeholder="输入提问内容..."></textarea>
    </div>

    <div class="ai-qa-controls">
      <button id="aiAskBtn" class="ai-qa-button">
        <span id="btnText">发送问题</span>
        <span id="loadingSpinner" class="loading-spinner" style="display: none;"></span>
      </button>
      <button id="clearHistoryBtn" class="ai-qa-button" style="background: #6c757d; margin-left: 12px;">
        清空历史
      </button>
    </div>
  </div>
</div>

<script>
  // AI问答功能
  (function () {
    const aiAskBtn = document.getElementById('aiAskBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const aiQuestion = document.getElementById('aiQuestion');
    const aiChatHistory = document.getElementById('aiChatHistory');
    const btnText = document.getElementById('btnText');
    const loadingSpinner = document.getElementById('loadingSpinner');

    // 从sessionStorage加载对话历史
    function loadChatHistory() {
      const history = JSON.parse(sessionStorage.getItem('ai_chat_history') || '[]');
      renderChatHistory(history);
      return history;
    }

    // 保存对话历史到sessionStorage
    function saveChatHistory(history) {
      sessionStorage.setItem('ai_chat_history', JSON.stringify(history));
    }

    // 渲染对话历史
    function renderChatHistory(history) {
      aiChatHistory.innerHTML = '';
      history.forEach(item => {
        // 渲染用户问题
        const userMessage = document.createElement('div');
        userMessage.style.cssText = 'display: flex; justify-content: flex-end; margin-bottom: 12px;';
        userMessage.innerHTML = `
          <div style="background: #e3f2fd; padding: 12px; border-radius: 12px; max-width: 80%;">
            <strong style="color: #1976d2;">你：</strong>
            <p>${item.question}</p>
          </div>
        `;
        aiChatHistory.appendChild(userMessage);

        // 渲染AI回答
        const aiMessage = document.createElement('div');
        aiMessage.style.cssText = 'display: flex; justify-content: flex-start; margin-bottom: 12px;';
        aiMessage.innerHTML = `
          <div style="background: #f5f5f5; padding: 12px; border-radius: 12px; max-width: 80%;">
            <strong style="color: #4caf50;">AI：</strong>
            <p>${item.answer}</p>
          </div>
        `;
        aiChatHistory.appendChild(aiMessage);
      });
      // 滚动到底部
      aiChatHistory.scrollTop = aiChatHistory.scrollHeight;
    }

    // 添加新的对话到历史
    function addToChatHistory(question, answer) {
      const history = loadChatHistory();
      history.push({ question, answer });
      // 只保留最近10轮对话
      if (history.length > 10) {
        history.shift();
      }
      saveChatHistory(history);
      renderChatHistory(history);
    }

    // 清空对话历史
    function clearChatHistory() {
      sessionStorage.removeItem('ai_chat_history');
      renderChatHistory([]);
    }

    // 页面加载时加载对话历史
    loadChatHistory();

    // 清空历史按钮事件
    if (clearHistoryBtn) {
      clearHistoryBtn.addEventListener('click', clearChatHistory);
    }

    // 发送问题事件
    if (aiAskBtn) {
      aiAskBtn.addEventListener('click', async () => {
        const question = (aiQuestion.value || '').trim();

        if (!question) {
          alert('请输入问题');
          return;
        }

        // 显示加载状态
        aiAskBtn.disabled = true;
        btnText.style.display = 'none';
        loadingSpinner.style.display = 'inline-block';

        // 先添加用户问题到对话历史
        const tempHistory = loadChatHistory();
        tempHistory.push({ question, answer: 'AI 正在思考...' });
        saveChatHistory(tempHistory);
        renderChatHistory(tempHistory);

        try {
          console.log('Sending request...');
          const res = await fetch("{% url 'article:global_ai_qa' %}?stream=1", {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'X-CSRFToken': '{{ csrf_token }}'
            },
            body: 'question=' + encodeURIComponent(question)
          });
          console.log('Response received:', res);

          const contentType = (res.headers.get('content-type') || '').toLowerCase();
          console.log('Content type:', contentType);

          if (!res.ok) {
            console.log('Response not ok:', res.status, res.statusText);
            if (contentType.includes('application/json')) {
              const data = await res.json();
              const errorMsg = data.msg || data.error || '请求失败';
              console.log('Error message:', errorMsg);
              // 更新对话历史，替换临时消息
              const history = loadChatHistory();
              history.pop(); // 移除临时消息
              history.push({ question, answer: errorMsg });
              saveChatHistory(history);
              renderChatHistory(history);
              return;
            } else {
              const text = await res.text();
              console.log('Error text:', text);
              // 更新对话历史，替换临时消息
              const history = loadChatHistory();
              history.pop(); // 移除临时消息
              history.push({ question, answer: '请求失败：' + text });
              saveChatHistory(history);
              renderChatHistory(history);
              return;
            }
          }

          if (!res.body) {
            console.log('No response body');
            const text = await res.text();
            console.log('Response text:', text);
            // 更新对话历史，替换临时消息
            const history = loadChatHistory();
            history.pop(); // 移除临时消息
            history.push({ question, answer: text });
            saveChatHistory(history);
            renderChatHistory(history);
            return;
          }

          console.log('Starting to read stream...');
          const reader = res.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let out = '';

          while (true) {
            const { done, value } = await reader.read();
            console.log('Read chunk:', done, value ? value.length : 0);
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            console.log('Decoded chunk:', chunk);
            out += chunk;
            // 实时更新对话历史中的AI回答
            const history = loadChatHistory();
            history.pop(); // 移除临时消息
            history.push({ question, answer: out });
            saveChatHistory(history);
            renderChatHistory(history);
          }

          console.log('Stream complete. Full response:', out);
          // 最终更新对话历史
          const history = loadChatHistory();
          history.pop(); // 移除临时消息
          history.push({ question, answer: out });
          saveChatHistory(history);
          renderChatHistory(history);
        } catch (e) {
          console.error('Error:', e);
          const errorMsg = '网络异常，请重试';
          // 更新对话历史，替换临时消息
          const history = loadChatHistory();
          history.pop(); // 移除临时消息
          history.push({ question, answer: errorMsg });
          saveChatHistory(history);
          renderChatHistory(history);
        } finally {
          // 恢复按钮状态
          aiAskBtn.disabled = false;
          btnText.style.display = 'inline';
          loadingSpinner.style.display = 'none';
          // 清空输入框
          aiQuestion.value = '';
        }
      });
    }
  })();
</script>

{% endblock %}
